[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "datapilot-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "sqlglot>=26,<31", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
legacy-ui = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<10"]
model = ["transformers>=5.15,<6", "torch>=2.11", "accelerate>=1"]
[tool.setuptools.packages.find]
include = ["datapilot*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL with seeded PostgreSQL"]
